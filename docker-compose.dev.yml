# Local development database for Ridmo.
#
# Prisma requires MongoDB to run as a replica set (it uses transactions), so this
# runs a single-node replica set and initiates it automatically via the healthcheck.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL="mongodb://localhost:27017/RIDMO?replicaSet=rs0&directConnection=true"
#   pnpm exec prisma db push   # create collections/indexes from the schema
services:
  mongo:
    image: mongo:7
    container_name: ridmo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - ridmo-mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run; afterwards it just reports healthy.
      test: |
        mongosh --quiet --port 27017 --eval "
          try { rs.status().ok } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok
          }
        " | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # S3-compatible object storage for admin uploads (images/videos/files).
  # Console: http://localhost:9001 (minioadmin / minioadmin). Public URL: http://localhost:9000/ridmo-media
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ridmo-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - ridmo-rustfs-data:/data
      - ridmo-rustfs-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot job: creates the bucket and makes it anonymously downloadable.
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: ridmo-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S3="aws --endpoint-url http://rustfs:9000 s3api"
        $$S3 head-bucket --bucket ridmo-media 2>/dev/null || $$S3 create-bucket --bucket ridmo-media
        $$S3 put-bucket-policy --bucket ridmo-media --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::ridmo-media/*"]}]}'

volumes:
  ridmo-mongo-data:
  ridmo-rustfs-data:
  ridmo-rustfs-logs:
