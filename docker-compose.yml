# Production stack for Ridmo (https://ridmo.com.py), fronted by Cloudflare.
#
# Traffic path: Cloudflare edge -> cloudflared (Tunnel, outbound only) -> app / rustfs.
# No container publishes a host port, so the server needs no open inbound ports
# and Cloudflare terminates TLS.
#
# Cloudflare Zero Trust > Networks > Tunnels > (your tunnel) > Public hostnames:
#   ridmo.com.py        -> http://app:3000
#   www.ridmo.com.py    -> http://app:3000
#   media.ridmo.com.py  -> http://rustfs:9000  (public S3 API / media files)
#   minio.ridmo.com.py  -> http://rustfs:9001  (admin console, protect with Cloudflare Access)
#
# Usage:
#   cp .env.production.example .env.production   # then fill it in
#   docker compose --env-file .env.production up -d --build
#   docker compose --env-file .env.production run --rm migrate   # first deploy: create collections/indexes
name: ridmo

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
      - rustfs
    networks: [edge]

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://ridmo.com.py
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-}
        NEXT_PUBLIC_PHONE_NUMBER: ${NEXT_PUBLIC_PHONE_NUMBER:-}
        NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER: ${NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: ridmo-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/RIDMO?replicaSet=rs0
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_URL: https://ridmo.com.py
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXT_PUBLIC_SITE_URL: https://ridmo.com.py
      NEXT_PUBLIC_APP_URL: https://ridmo.com.py
      NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-}
      NEXT_PUBLIC_PHONE_NUMBER: ${NEXT_PUBLIC_PHONE_NUMBER:-}
      NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER: ${NEXT_PUBLIC_WHATSAPP_PHONE_NUMBER:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: https://ridmo.com.py
      BANK_TRANSFER_BANK_NAME: ${BANK_TRANSFER_BANK_NAME:-}
      BANK_TRANSFER_ACCOUNT_HOLDER: ${BANK_TRANSFER_ACCOUNT_HOLDER:-}
      BANK_TRANSFER_ACCOUNT_NUMBER: ${BANK_TRANSFER_ACCOUNT_NUMBER:-}
      BANK_TRANSFER_ALIAS: ${BANK_TRANSFER_ALIAS:-}
      BANK_TRANSFER_NOTES: ${BANK_TRANSFER_NOTES:-}
      # S3-compatible storage (RustFS)
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${RUSTFS_BUCKET:-ridmo-media}
      S3_ACCESS_KEY_ID: ${RUSTFS_ROOT_USER:?set RUSTFS_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_ROOT_PASSWORD:?set RUSTFS_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: https://media.ridmo.com.py/${RUSTFS_BUCKET:-ridmo-media}
    depends_on:
      mongo:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    networks: [edge, internal]

  # One-off job: `docker compose run --rm migrate` (needs the schema, so it reuses the app image).
  migrate:
    image: ridmo-app:latest
    profiles: [tools]
    command: ["./node_modules/.bin/prisma", "db", "push"]
    environment:
      DATABASE_URL: mongodb://mongo:27017/RIDMO?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Prisma needs a replica set (transactions). Single node, reachable only on the internal network.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --port 27017 --eval "
          try { rs.status().ok } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok
          }
        " | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks: [internal]

  # S3-compatible object storage (RustFS; MinIO no longer publishes community images).
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:?set RUSTFS_ROOT_USER}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?set RUSTFS_ROOT_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_BROWSER_REDIRECT_URL: https://minio.ridmo.com.py
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [edge, internal]

  # Creates the bucket on first run and makes objects publicly readable (read-only, no listing).
  rustfs-init:
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${RUSTFS_BUCKET:-ridmo-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S3="aws --endpoint-url http://rustfs:9000 s3api"
        $$S3 head-bucket --bucket "$$BUCKET" 2>/dev/null || $$S3 create-bucket --bucket "$$BUCKET"
        $$S3 put-bucket-policy --bucket "$$BUCKET" --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::'"$$BUCKET"'/*"]}]}'
    networks: [internal]

networks:
  # Reachable from cloudflared.
  edge:
  # Databases and storage internals; no outside access.
  internal:
    internal: true

volumes:
  mongo-data:
  rustfs-data:
  rustfs-logs:
